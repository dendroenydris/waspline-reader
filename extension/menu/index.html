<!DOCTYPE html>

<html>
<head>
	<meta charset="utf-8">
	<style>
		html, body {width: 280px; font-family: sans-serif; font-size: 13px;}
		h1 {
			background-image: url("/icons/wasp48.png");
			background-size: contain;
			background-repeat: no-repeat;
			font-size: 15pt;
			padding-left: 1.5em;
			margin-bottom: 10px;
		}
		.hidden {display: none;}
		#site_display {color: grey; padding-left: 1.5em;} 
		#gradient_size {width: 200px;}
		
		/* Domain blacklist styles */
		.section {
			margin: 10px 0;
			padding: 8px 0;
			border-top: 1px solid #eee;
		}
		.section-title {
			font-weight: bold;
			margin-bottom: 8px;
			color: #333;
		}
		#current-domain {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 8px;
			padding: 6px 8px;
			background: #f5f5f5;
			border-radius: 4px;
		}
		#current-domain-name {
			flex: 1;
			font-family: monospace;
			font-size: 12px;
			color: #666;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}
		.btn {
			padding: 4px 8px;
			border: 1px solid #ccc;
			border-radius: 4px;
			background: #fff;
			cursor: pointer;
			font-size: 12px;
		}
		.btn:hover {
			background: #f0f0f0;
		}
		.btn-danger {
			color: #c00;
			border-color: #c00;
		}
		.btn-danger:hover {
			background: #fee;
		}
		.btn-success {
			color: #080;
			border-color: #080;
		}
		.btn-success:hover {
			background: #efe;
		}
		#add-domain-form {
			display: flex;
			gap: 4px;
			margin-bottom: 8px;
		}
		#new-domain-input {
			flex: 1;
			padding: 4px 8px;
			border: 1px solid #ccc;
			border-radius: 4px;
			font-size: 12px;
		}
		#blacklist-container {
			max-height: 120px;
			overflow-y: auto;
			border: 1px solid #eee;
			border-radius: 4px;
		}
		.blacklist-item {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 4px 8px;
			border-bottom: 1px solid #eee;
		}
		.blacklist-item:last-child {
			border-bottom: none;
		}
		.blacklist-domain {
			font-family: monospace;
			font-size: 11px;
			color: #666;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			flex: 1;
		}
		.remove-btn {
			color: #c00;
			cursor: pointer;
			padding: 2px 6px;
			font-size: 14px;
		}
		.remove-btn:hover {
			background: #fee;
			border-radius: 3px;
		}
		.empty-list {
			color: #999;
			font-style: italic;
			padding: 8px;
			text-align: center;
		}
		.domain-disabled-notice {
			background: #fff3cd;
			border: 1px solid #ffc107;
			border-radius: 4px;
			padding: 8px;
			margin-bottom: 10px;
			color: #856404;
			font-size: 12px;
		}
	</style>
</head>

<body>
	<div id="popup-content">
		<h1>WaspLine Reader</h1>

		<div id="domain-disabled-notice" class="domain-disabled-notice hidden">
			⚠️ WaspLine is disabled on this site
		</div>

		<div>
		<input type="checkbox" id="enabled" name="enabled">
		<label for="enabled">Enable WaspLine</label>
		</div><br />
		
		<div>
		<label for="gradient_size">Gradient Size (%)</label>
		<input type="range" id="gradient_size" name="gradient_size" min="0" max="100" value="10">
		</div>

		<div>
		<input type="color" id="color1" name="color1" value="#0000FF">
		<label for="color1">Color 1</label><br />
		</div>

		<div>
		<input type="color" id="color2" name="color2" value="#FF0000">
		<label for="color2">Color 2</label>
		</div>

		<div>
		<input type="color" id="color_text" name="color_text" value="#000000">
		<label for="color_text">Text Color</label>
		</div>

		<!-- Domain Blacklist Section -->
		<div class="section">
			<div class="section-title">🚫 Disabled Sites</div>
			
			<div id="current-domain">
				<span id="current-domain-name">-</span>
				<button id="toggle-domain-btn" class="btn btn-danger">Disable here</button>
			</div>

			<div id="add-domain-form">
				<input type="text" id="new-domain-input" placeholder="example.com">
				<button id="add-domain-btn" class="btn">Add</button>
			</div>

			<div id="blacklist-container">
				<div class="empty-list">No disabled sites</div>
			</div>
		</div>
		
	</div>
	<div id="error-content" class="hidden">
		<p>Can't use WaspLine Reader on this web page.</p>
	</div>
	<script src="menu.js"></script>
</body>

</html>
